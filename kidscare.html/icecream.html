<!DOCTYPE html>
<html>
    <head>
        <title>Ice Cream menu</title>
        <style>
            body {
                background-color: #ffffba;
                font-family: Arial, sans-serif;
                text-align: center;
            }
            h1 {
                color: #fdb2d7;
            }
            .shop-description {
                font-size: 1.2em;
                margin-bottom: 20px;
            }
            .menu-box {
                border: 2px solid #ffa9d4;
                padding: 20px;
                display: inline-block;
                background-color: #fff0f5;
                border-radius: 7px;
            }
            ul {
                padding: 0;
            }
            ul > li{
                list-style-type: none;
            }
            li {
                margin: 10px 0;
                font-size: 1.1em;
            }
            button {
                background-color: #ff69b4;
                color: rgba(246, 245, 244, 0.562);
                border: none;
                padding: 10px 20px;
                cursor: pointer;
                font-size: 1em;
            }
            button:hover {
                background-color: #ff1493;
            }
            </style>
    </head>
    <body>
        <h1> My Ice Cream Shop Menu</h1>
        <p>Welcome to our ice cream shop!</p>
        <p class="shop description">
            Check out our delicious ice cream flavors!</p>
            <div class="menu-box">
                <h2>Flavors</h2>
                <ul>
                    <li>Vanilla dream</li>
                    <li>Chocolate delight</li>
                    <li>Strawberry swirl</li>
                    <li>blueberry blast</li>
                    <li>Mango magic- Todays special</li>
                    <button>Order Now</button>
                </ul>
            </div>
    </body>
</html>
