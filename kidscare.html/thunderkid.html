<!DOCTYPE html>
<html>
    <head>
        <style>
            body{
                background-color:midnightblue ;
                color: aliceblue;
                font-family: cursive, sans-serif;
            }
            .hero-name{
                font-size: 60px;
                font-weight: bold;
                color:rgba(245, 213, 10, 0.726);
                text-shadow: 3px 3px orange;
            }
            .tagline{
                font-style: italic;
                color: lightblue;
                text-decoration: capitalize;
            }
            .power{
                font-weight: bold;
                color: lightgreen;
            }
            .weakness{
                text-decoration: line-through;
                color:red ;
            }
            .label{
                font-style: italic;
                text-decoration: capitalize;
                color: darkgray;
            }
            .badge{
                font-size: 28px;
                font-weight: bold;
                color: gold;
                transform: rotate(12deg);
            }
            .made-by{
                color: lightpink;
                font: initial;
            }
        </style>

    </head>
    <body>
        <h1 class="hero-name">Thunder kid</h1>
        <p class="tag-line">the most powerful hero in the school.</p>
         

        <h2 class="label">super powers:</h2>
        <h2 class="power">Can run faster than a cheetah.</h2>
        <h2 class="power">Can lift a school bus.</h2>

        <h2 class="label">Weaknesses:</h2>
        <h2 class="weakness">Math homework</h2>
        <h2 class="weakness">broccoli</h2>

        <p class="badge">Top hero.</p>
        <p class="made-by">Created by Wania bilal</p>
    </body>
</html>
