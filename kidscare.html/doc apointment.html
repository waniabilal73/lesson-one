<!DOCTYPE html>
<html>
    <head>
        <title>DOCTORS APPOINTMENT</title>

        
    </head>

    <body>
        <h1>DOCTORS APPOINTMENT</h1>
        <p>FILL THE FORM BELOW.</p>

        <hr>
        <form>

            <fieldset>
                <legend>PERSONAL INFORMATION</legend><br>

                <label>YOUR NAME:</label><br>
                <input type="text" name="name" placeholder="Enter your name"><br><br>
                <label>PATIENT ID:</label><br>
                <input type="text" name="id" placeholder="Enter your patient id"><br><br>
                <label>DATE OF BIRTH:</label><br>
                <input type="date" name="dob"><br><br>
                
            </fieldset>

            <br>
            <fieldset>
                <legend>YOUR VISIT</legend>
                <label>CHOOSE YOUR DOCTOR:</label>
                <select >
                    <option value="DR.GREENBRIER">DR.GREENBRIER</option>
                    <option value="DR.MALFOY">DR.MALFOY</option>
                    <option value="DR.HAWTHRONE">DR.HAWTHRONE</option>
                </select><br><br>


            </fieldset>
            <br>
            <input type="submit" value="BOOK MY APPOINTMENT">

        </form>
    </body>
</html>
