<!DOCTYPE html>
<html>
    <head>

        <title>Animal Fact File</title>
        <style>
            body{
                background-color: #fdb4b4b9;
                font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            }

            .fact-file{
                background-color:cadetblue;
                border: 1px solid #ccc;
                border-radius: 6.7px;
                padding: 20px;
                width: 300px;
                margin: 50px solid lightblue;
            }
            .animal-name{
                color:lavenderblush;
                font-size: 24px;
            }
            .details{
                color:mistyrose;
            }
            .cool-fact{
                color:rgb(17, 57, 88);
                font-style:italic;
            }







        </style>

    </head>
    <body>
         

        <div class="fact-file">
        <h2 class="animal-name">Snow Leopard</h2>
        <p class="details">Type:Big Cats</p>
        <p class="details">Lives In:High mountains Of Central Asia</p>
        <p class="details">Diet:Meat</p>
        <p class="cool-fact">Cool Fact:Can Leap Up To 15 Meters in one jump!</p>
        </div>
    </body>
</html>
